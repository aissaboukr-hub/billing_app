plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.example.billing_app'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId 'com.example.billing_app'
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}


// Codemagic compatibility: ensure the release APK is also available at
// the standard Flutter artifact location expected by the build step.
afterEvaluate {
    tasks.named('assembleRelease').configure {
        doLast {
            def apk = file("${project.buildDir}/outputs/apk/release/app-release.apk")
            def flutterOutput = file("${rootProject.projectDir.parentFile}/build/app/outputs/flutter-apk")
            if (apk.exists()) {
                flutterOutput.mkdirs()
                copy {
                    from apk
                    into flutterOutput
                }
            }
        }
    }
}
